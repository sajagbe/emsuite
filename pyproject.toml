[project]
name = "emsuite"
version = "1.6.0"
description = "Electrostatic Map Suite - A Comprehensive Set of Calculators for Qualifying and Quantifying Electrostatic Interactions and Effects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geometric>=1.1",
    "pyscf>=2.10.0",
    "rdkit>=2025.3.5",
    "vdw-surfgen>=0.5.6",
    "numpy",
    "ray>=2.50.1",
    "apbs-binary>=3.4.1.1",
    "pdb2pqr>=3.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0",
]
gpu = [
    "gpu4pyscf-cuda12x==1.4.3",
    "gpu4pyscf-libxc-cuda12x==0.5",
    "cupy-cuda12x==13.6.0",
    "cutensor-cu12==2.0.2",
]
docs = [
    "sphinx<7.0",
    "myst-parser<2.0",
]

[project.scripts]
emsuite = "emsuite.cli.main:main"
surf2mol2 = "emsuite.cli.surf2mol2:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires PySCF QM calculation",
    "gpu: requires CUDA GPU",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["emsuite"]
