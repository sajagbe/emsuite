[project]
site_name = "EMSuite Docs"
site_description = "Electrostatic Map Suite — build molecular surfaces, map electrostatic potentials, and quantify electrostatic effects on molecular properties."
site_author = "Stephen O. Ajagbe"
site_url = "https://sajagbe.github.io/emsuite/"
repo_url = "https://github.com/sajagbe/emsuite"
repo_name = "sajagbe/emsuite"
copyright = "Copyright &copy; 2026 Stephen O. Ajagbe"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "quick-start.md" },
  { "Concepts" = "concepts.md" },
  { "Guides" = [
    "guides/surface.md",
    "guides/potential.md",
    "guides/tuning.md",
    "guides/coupled.md",
    "guides/python.md",
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/inputs.md",
    "reference/python-api.md",
    "reference/properties.md",
    "reference/outputs.md",
    "reference/file-formats.md",
  ] },
  { "Developers" = [
    "developers/architecture.md",
    "developers/testing.md",
    "developers/documentation.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Geist"
code = "Geist Mono"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/sajagbe/emsuite"
